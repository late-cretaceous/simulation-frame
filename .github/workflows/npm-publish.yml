name: Publish Package to npm

on:
  push:
    branches:
      - samurai
  workflow_dispatch:  # Add this to enable manual triggering

# Add permissions block at this level
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Important: Use a token with write permissions
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true # Changed from false to true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org/'

      # Replace npm ci with npm install to update the lock file
      - name: Install dependencies and update lock file
        run: npm install

      - name: Install semantic-release and plugins
        run: npm install --no-save semantic-release @semantic-release/git @semantic-release/github @semantic-release/npm @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      # Run lint but continue on error
      - name: Lint (non-blocking)
        run: npm run lint || echo "Linting failed but continuing build"
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Release
        env:
          # Pass the GitHub token to semantic-release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Explicitly specify branch configuration
        run: npx semantic-release --branches samurai